name: Login Lux

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email du compte"
        required: true
        type: string
      password:
        description: "Mot de passe du compte"
        required: true
        type: string
      platform:
        description: "Plateforme lux (tronlux, usdtlux, btclux, xrplux, pepelux, bnblux, shibalux...)"
        required: true
        type: string
      initialTimer:
        description: "Timer initial (format mm:ss)"
        required: false
        type: string
        default: "60:00"
      userId:
        description: "Identifiant utilisateur Supabase"
        required: false
        type: string

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: ghcr.io/hasiniainahasina1-art/camoufox-system:latest
      options: --user camoxuser

    steps:
      - name: Masquer tous les secrets
        run: |
          echo "::add-mask::${{ secrets.GH_TOKEN }}"
          echo "::add-mask::${{ secrets.CRYPTO_SECRET }}"
          echo "::add-mask::${{ secrets.CRON_SECRET }}"
          echo "::add-mask::${{ secrets.APP_URL }}"
          echo "::add-mask::hasiniainahasina1-art"
          echo "::add-mask::pick-faucet"

      - name: Masquer les donnees sensibles
        run: |
          echo "::add-mask::${{ github.event.inputs.password }}"
          echo "::add-mask::${{ github.event.inputs.email }}"
          echo "::add-mask::${{ github.event.inputs.userId }}"
          echo "::add-mask::hasiniainahasina1-art"
          echo "::add-mask::pick-faucet"

      - name: Cloner le depot prive dans /app
        timeout-minutes: 2
        run: |
          set -e
          git clone \
            --quiet \
            --depth=1 \
            --branch main \
            https://${{ secrets.GH_TOKEN }}@github.com/hasiniainahasina1-art/pick-faucet.git \
            /tmp/repo

          cp -rn /tmp/repo/. /app/ || true
          cp /tmp/repo/.env /app/.env 2>/dev/null || true
          rm -rf /tmp/repo

          mkdir -p /app/videos

          echo "Depot prive copie dans /app"
          ls -la /app | head -40

      - name: Verifier les fichiers requis
        timeout-minutes: 1
        run: |
          for f in lux_login.py ananana.py; do
            if [ ! -f "/app/$f" ]; then
              echo "Fichier manquant : $f"
              exit 1
            else
              echo "Present : $f"
            fi
          done

      - name: Executer le script de login
        id: login
        timeout-minutes: 10
        working-directory: /app
        env:
          PYTHONUNBUFFERED: "1"
          HOME: /home/camoxuser
          DISPLAY: ":99"
          TEST_EMAIL: ${{ github.event.inputs.email }}
          TEST_PASSWORD: ${{ github.event.inputs.password }}
          TEST_PLATFORM: ${{ github.event.inputs.platform }}
          TEST_PROXY_INDEX: "0"
          TEST_INITIAL_TIMER: ${{ github.event.inputs.initialTimer }}
          USER_ID: ${{ github.event.inputs.userId }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USERNAME: hasiniainahasina1-art
          GH_REPO: pick-faucet
          GH_BRANCH: main
          CRYPTO_SECRET: ${{ secrets.CRYPTO_SECRET }}
        run: |
          set +e
          echo "::add-mask::${{ github.event.inputs.password }}"
          echo "::add-mask::${{ github.event.inputs.email }}"
          echo "::add-mask::${{ github.event.inputs.userId }}"

          export PYTHONUNBUFFERED=1
          timeout 540 xvfb-run -s "-screen 0 1280x720x24" --auto-servernum \
            python -u lux_login.py
          EXIT_CODE=$?

          if [ "$EXIT_CODE" = "124" ]; then
            echo "Timeout login (9 min)"
            echo "exit_code=124" >> "$GITHUB_OUTPUT"
            exit 124
          fi

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE

      - name: Upload video de session
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-login-lux-${{ github.event.inputs.platform }}-${{ github.run_id }}
          path: /app/videos/
          retention-days: 1
          if-no-files-found: warn

      - name: Resultat final
        if: always()
        run: |
          CODE="${{ steps.login.outputs.exit_code }}"
          PLATFORM="${{ github.event.inputs.platform }}"

          if [ "$CODE" = "0" ]; then
            echo "Login reussi - plateforme $PLATFORM"
          elif [ "$CODE" = "124" ]; then
            echo "Timeout - plateforme $PLATFORM"
            exit 1
          else
            echo "Login echoue (code $CODE) - plateforme $PLATFORM"
            exit 1
          fi
